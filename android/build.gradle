buildscript {
  ext.I18nKit = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 29,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return I18nKit[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.i18nkit"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    // Android 10 (API 29) is the documented minimum for this library.
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  // This module ships no native (.so) binaries of its own, so there are no
  // 16 KB page-size linker flags to set here.
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.appcompat:appcompat:1.7.0" // AppCompatDelegate.setApplicationLocales backport
  implementation "androidx.core:core-ktx:1.13.1"

  testImplementation "junit:junit:4.13.2"
}
